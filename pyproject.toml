[build-system]
requires = ["setuptools>=64.0", "scikit-build-core>=0.11", "pybind11"]
build-backend = "setuptools.build_meta"


[project]
name = "flag_audio"
version = "0.3.0"
description = "FlagAudio is a function library written in Triton."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8.0"
license = { text = "Apache Software License" }
authors = [
    { name = "Bin Jiang", email = "xxx@xxx.com" },
    { name = "JunWei Ti", email = "xxx@xxx.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch>=2.6.0",
    "packaging",
    "pybind11",
    "PyYAML",
    "sqlalchemy",
]

[project.optional-dependencies]
test = [
    "pytest>=7.1.0",
    "numpy>=1.26",
    "scipy>=1.14",
    "cupy-cuda12x",
    "torchaudio>=2.6.0",
]

ascend-cann850 = [
    "torch==2.9.0+cpu",
    "torch-npu==2.9.0",
    "torchaudio==2.9.0",
    "flag_gems==5.3.0+ascend3.2",
    "flagtree==0.6.0+ascend3.2",
]

ascend-cann900 = [
    "torch==2.10.0+cpu",
    "torch-npu==2.10.0",
    "torchaudio==2.10.0",
    "flag_gems==5.3.0+ascend3.5",
    "flagtree==0.6.0+ascend3.5",
]

mthreads = [
    "torch_musa==2.7.1",
    "torchaudio==2.7.1",
    "flag_gems==5.3.0+mthreads3.6",
    "flagtree==0.6.1+mthreads3.6",
]

nvidia-cuda128 = [
    "torch==2.10.0+cu128",
    "torchaudio==2.10.0+cu128",
    "flag_gems>=5.3.0",
    "flagtree>=0.6.0",
]

nvidia-cuda133 = [
    "torch==2.11.0+cu130",
    "torchaudio==2.11.0+cu130",
    "flag_gems>=5.3.0",
    "flagtree>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/flagos-ai/FlagAudio"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flag_audio.runtime" = ["*/**/*.yaml"]

[tool.scikit-build]
build.verbose = true
logging.level = "INFO"
wheel.install-dir = "flag_audio"
build-dir = "build/{cache_tag}"
