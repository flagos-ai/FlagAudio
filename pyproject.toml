[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"


[project]
name = "flag_audio"
version = "0.4.0-dev1"
description = "FlagAudio is a function library written in Triton."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8.0"
license = { text = "Apache Software License" }
authors = [
    { name = "Bin Jiang", email = "xxx@xxx.com" },
    { name = "JunWei Ti", email = "xxx@xxx.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    # Keep torch as a runtime requirement. For pre-provisioned accelerator images,
    # install this project with `python -m pip install --no-deps -e .` so pip cannot
    # replace the image's vendor-specific torch build.
    "torch>=2.6.0",
    "packaging",
    "pybind11",
    "PyYAML",
    "sqlalchemy",
]

[project.optional-dependencies]
# Vendor extras do not select an SDK release. Use the vendor's package index
# and a matching preinstalled torch stack for the target accelerator.
test = [
    "pytest>=7.1.0",
    "numpy>=1.26",
    "scipy>=1.14",
    "cupy-cuda12x",
    "torchaudio>=2.6.0",
]

ascend = [
    "torch-npu",
    "torchaudio",
    "flag_gems>=5.3.0",
    "flagtree>=0.6.0",
]

mthreads = [
    "torch_musa",
    "torchaudio",
    "flag_gems>=5.3.0",
    "flagtree>=0.6.0",
]

iluvatar = [
    "torchaudio",
    "triton",
    "flag_gems>=5.3.0",
    "flagtree>=0.6.0",
]

nvidia = [
    "torchaudio",
    "flag_gems>=5.3.0",
    "flagtree>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/flagos-ai/FlagAudio"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flag_audio.runtime" = ["*/**/*.yaml"]

[tool.scikit-build]
build.verbose = true
logging.level = "INFO"
wheel.install-dir = "flag_audio"
build-dir = "build/{cache_tag}"
